<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación 2FA - Sistema ISP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            padding: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            color: white;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 15px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 18px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 24px;
            letter-spacing: 8px;
            text-align: center;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            font-weight: 700;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .info-box p {
            color: #0d47a1;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">
                <i class="fas fa-lock"></i>
            </div>
            <h1>Verificación de Dos Factores</h1>
            <p class="subtitle">Ingresa el código de tu aplicación autenticadora</p>
        </div>

        <div id="alert" class="alert"></div>

        <div class="info-box">
            <p>
                <i class="fas fa-info-circle"></i>
                Abre tu app autenticadora (Google Authenticator, Authy, etc.) y ingresa el código de 6 dígitos.
            </p>
        </div>

        <form id="verify-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="code">
                    <i class="fas fa-key"></i> Código de Verificación
                </label>
                <input
                    type="text"
                    id="code"
                    name="code"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    placeholder="000000"
                    required
                    autocomplete="off"
                    autofocus
                >
            </div>
            <button type="submit" class="btn" id="verify-btn">
                <i class="fas fa-shield-alt"></i>
                <span>Verificar</span>
            </button>
        </form>

        <a href="/cobertura/login/" class="back-link">
            <i class="fas fa-arrow-left"></i> Volver al login
        </a>
    </div>

    <script>
        const form = document.getElementById('verify-form');
        const alertDiv = document.getElementById('alert');
        const verifyBtn = document.getElementById('verify-btn');
        const codeInput = document.getElementById('code');

        console.log('[DEBUG] Script loaded');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            console.log('[DEBUG] Form submitted');
            console.log('[DEBUG] Code value:', codeInput.value);

            verifyBtn.disabled = true;
            verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Verificando...</span>';

            try {
                console.log('[DEBUG] Sending request to API...');
                
                const response = await fetch('/cobertura/api/2fa/verify-login/', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify({
                        code: codeInput.value
                    })
                });

                console.log('[DEBUG] Response status:', response.status);
                console.log('[DEBUG] Response OK:', response.ok);

                const data = await response.json();
                console.log('[DEBUG] Response data:', data);

                if (data.success) {
                    console.log('[DEBUG] SUCCESS! Redirect URL:', data.redirect_url);
                    
                    alertDiv.className = 'alert alert-success';
                    alertDiv.style.display = 'block';
                    alertDiv.innerHTML = '<i class="fas fa-check-circle"></i> Código correcto. Redirigiendo...';

                    setTimeout(() => {
                        console.log('[DEBUG] Executing redirect NOW to:', data.redirect_url);
                        window.location.href = data.redirect_url;
                        console.log('[DEBUG] Redirect executed');
                    }, 1000);
                } else {
                    console.log('[DEBUG] FAILED:', data.message);
                    
                    alertDiv.className = 'alert alert-error';
                    alertDiv.style.display = 'block';
                    alertDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + data.message;

                    codeInput.value = '';
                    codeInput.focus();

                    verifyBtn.disabled = false;
                    verifyBtn.innerHTML = '<i class="fas fa-shield-alt"></i> <span>Verificar</span>';
                }
            } catch (error) {
                console.error('[DEBUG] CATCH ERROR:', error);
                
                alertDiv.className = 'alert alert-error';
                alertDiv.style.display = 'block';
                alertDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Error de conexión. Intenta de nuevo.';

                verifyBtn.disabled = false;
                verifyBtn.innerHTML = '<i class="fas fa-shield-alt"></i> <span>Verificar</span>';
            }
        });

        // Solo permitir números
        codeInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        // Auto-submit cuando tenga 6 dígitos
        codeInput.addEventListener('input', (e) => {
            if (e.target.value.length === 6) {
                console.log('[DEBUG] Auto-submitting form (6 digits reached)');
                setTimeout(() => {
                    form.dispatchEvent(new Event('submit'));
                }, 100);
            }
        });
    </script>
</body>
</html>
